# HyperProx Docker Compose Stack
# Infrastructure services only — api/frontend/setup run as systemd units
# Do not add 'version:' — deprecated in Compose v2
#
# The one compose file: install.sh, deploy.sh and the setup wizard all use this file as it is. Anything
# per-install comes from .env, including COMPOSE_PROFILES (monitoring, ai), which compose reads itself.
#
# Nothing here is published beyond loopback except nginx on 80 and 443. Prometheus and Grafana use the host
# network so Grafana can reach Prometheus on 127.0.0.1; both bind 127.0.0.1, and Grafana is reached only
# through nginx at /grafana/, which asks the API for a valid HyperProx session first.

services:
  postgres:
    image: postgres:16.13-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    container_name: hyperprox-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.8-alpine@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
    container_name: hyperprox-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The vault gate. Stock, unmodified Vaultwarden, pinned by digest (never :latest). HyperProx refuses to
  # run without it: sign-in to HyperProx IS a sign-in to this vault. Bound to loopback only; HyperProx's
  # API is the only thing that talks to it. Signups are off - accounts exist only by invitation.
  # Version: Vaultwarden 1.37.4 (multi-arch index digest). To update, change the tag AND the digest together.
  vault:
# 1.37.x reports a Manager as type 4 (Custom); HyperProx's roles rely on that (apps/api/src/lib/users/roles.ts
# VAULT_REPORTS_MANAGER_AS_CUSTOM; test/vault-members.test.ts fails when this tag leaves 1.37).
    image: vaultwarden/server:1.37.4@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055
    container_name: hyperprox-vault
    restart: unless-stopped
    environment:
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "true"
      ORG_GROUPS_ENABLED: "true"
      SHOW_PASSWORD_HINT: "false"
      # Argon2id PHC hash of the admin-panel token (the plain token is VAULT_ADMIN_TOKEN in .env). Empty
      # disables the admin panel, so an install missing the hash fails closed.
      ADMIN_TOKEN: ${VAULT_ADMIN_TOKEN_HASH:-}
      # Origin used in Send links and invitation emails. Leave VAULT_PUBLIC_URL empty and links use the
      # loopback origin; set it to the https address users can reach if links must work from elsewhere.
      DOMAIN: ${VAULT_PUBLIC_URL:-https://127.0.0.1:8222}
      # TLS on loopback: the Bitwarden CLI refuses any non-https server. Self-signed cert made by the
      # installer in config/vault-tls; HyperProx trusts it through VAULT_CA_CERT.
      ROCKET_TLS: '{certs="/ssl/cert.pem",key="/ssl/key.pem"}'
    volumes:
      - vault_data:/data
      - ./config/vault-tls:/ssl:ro
    ports:
      - "127.0.0.1:8222:80"
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  prometheus:
    # Pinned by digest (never :latest). Version: Prometheus 3.11.2 (multi-arch index digest). To update,
    # change the tag AND the digest together.
    image: prom/prometheus:v3.11.2@sha256:5550dc63da361dc30f6fe02ac0e4dfc736ededfef3c8d12a634db04a67824d78
    container_name: hyperprox-prometheus
    restart: unless-stopped
    profiles: [monitoring]
    network_mode: host
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      # Loopback only: no authentication of its own, and --web.enable-lifecycle below accepts /-/quit.
      - "--web.listen-address=127.0.0.1:9090"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-90d}"
      - "--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-40GB}"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
      - ./config/prometheus/targets:/etc/prometheus/targets:ro
      # Bearer token for the plug-in metrics scrape — generated per install,
      # gitignored, mounted as a directory so a missing file cannot become one.
      - ./config/prometheus/secrets:/etc/prometheus/secrets:ro
      - ./data/prometheus:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    # Pinned by digest (never :latest): Grafana is served on HyperProx's own origin, so a Grafana change
    # is a HyperProx change. Version: Grafana 13.0.1 (multi-arch index digest). To update, change the tag
    # AND the digest together.
    image: grafana/grafana:13.0.1@sha256:0f86bada30d65ef9d0183b90c1e2682ac92d53d95da8bed322b984ea78a4a73a
    container_name: hyperprox-grafana
    restart: unless-stopped
    profiles: [monitoring]
    # Host network, loopback only: it reads Prometheus on 127.0.0.1:9090, and browsers reach it only through
    # nginx at /grafana/ (gated on a HyperProx session), so its anonymous viewer is never on the network.
    network_mode: host
    environment:
      - GF_SERVER_HTTP_ADDR=127.0.0.1
      - GF_SERVER_HTTP_PORT=3003
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      # Read only when Grafana first sets up its database. After the first owner sign-in it lives in the vault
      # and is absent from .env, which leaves an existing Grafana as it is.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-}
      - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_ANONYMOUS_HIDE_VERSION=true
      # No way to become anything but that anonymous viewer from behind nginx: no login form, no basic
      # auth, no plugin admin. (nginx also strips Cookie and Authorization, so no session or service
      # account token reaches it.) Admin work: docker exec hyperprox-grafana grafana cli admin ...
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_BASIC_ENABLED=false
      - GF_PLUGINS_PLUGIN_ADMIN_ENABLED=false
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_COOKIE_SAMESITE=disabled
      # The Monitoring page embeds Grafana from the same origin, at https://<host>/grafana/: the installer
      # (and bin/hyperprox-config for older installs) sets these in .env. Unset, Grafana answers at the root
      # of 127.0.0.1:3003, which nginx does not serve (these defaults are Grafana's own).
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-%(protocol)s://%(domain)s:%(http_port)s/}
      - GF_SERVER_SERVE_FROM_SUB_PATH=${GRAFANA_SERVE_FROM_SUB_PATH:-false}
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana

  pve-exporter:
    image: prompve/prometheus-pve-exporter:3.8.3@sha256:4527b8080c4bd53ae8d7326ff7a3469dad0c1abb5753ff0bae9f1ef1c23cb2c9
    container_name: hyperprox-pve-exporter
    restart: unless-stopped
    profiles: [monitoring]
    volumes:
      - ./config/pve-exporter/pve.yml:/etc/prometheus/pve.yml:ro
    ports:
      - "127.0.0.1:9221:9221"
    networks:
      - hyperprox-net

  # Optional local AI for the deployment wizard (docker compose --profile ai up -d ollama). CPU only, capped
  # so it cannot starve the API, and bound to loopback because Ollama has no authentication of its own.
  # Pulled models live in ollama_data. Version: Ollama 0.40.5. To update, change the tag.
  ollama:
    image: ollama/ollama:0.40.5
    container_name: hyperprox-ollama
    restart: unless-stopped
    profiles: [ai]
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
    cpus: "${OLLAMA_CPUS:-3}"   # also the default thread count: the API reads this limit from docker
    mem_limit: 4g
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

  # The front door: https on 443 (http on 80 redirects). Host networking, so the API, frontend and setup
  # wizard - systemd services on the host - are reached on loopback and can stay bound to 127.0.0.1
  # instead of every interface. It listens on 80 and 443 directly; there is no port mapping.
  nginx:
    image: nginx:1.29.8-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    container_name: hyperprox-nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Mounting the whole directory is deliberate: it replaces the image's
      # stock default.conf, which nginx.conf's `include conf.d/*.conf` would
      # otherwise load instead of ours — serving /usr/share/nginx/html and
      # 404ing every route.
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      # cert.pem + key.pem: self-signed by the installer unless you supply your own (gitignored, *.pem).
      - ./certs:/etc/nginx/certs:ro
      # Per-install list of reverse proxies whose X-Forwarded-Proto is believed (see conf.d/hyperprox.conf).
      # Under data/, so it is gitignored; an empty or missing directory means loopback only.
      - ./data/nginx/trusted-proxies:/etc/nginx/trusted-proxies:ro

  # There is no bundled Nginx Proxy Manager: it needs ports 80 and 443, which nginx above holds, so it could
  # never start. Install NPM into its own container from the Catalogue instead.

networks:
  hyperprox-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  vault_data:
  grafana_data:
  ollama_data:
