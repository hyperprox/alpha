# HyperProx Docker Compose Stack
# Infrastructure services only — api/frontend/setup run as systemd units
# Do not add 'version:' — deprecated in Compose v2
#
# The one compose file: install.sh, deploy.sh and the setup wizard all use this file as it is. Anything
# per-install comes from .env, including COMPOSE_PROFILES (monitoring, npm), which compose reads itself.

services:
  postgres:
    image: postgres:16-alpine
    container_name: hyperprox-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: hyperprox-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The vault gate. Stock, unmodified Vaultwarden, pinned by digest (never :latest). HyperProx refuses to
  # run without it: sign-in to HyperProx IS a sign-in to this vault. Bound to loopback only; HyperProx's
  # API is the only thing that talks to it. Signups are off - accounts exist only by invitation.
  # Version: Vaultwarden 1.37.4 (multi-arch index digest). To update, change the tag AND the digest together.
  vault:
    image: vaultwarden/server:1.37.4@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055
    container_name: hyperprox-vault
    restart: unless-stopped
    environment:
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "true"
      ORG_GROUPS_ENABLED: "true"
      SHOW_PASSWORD_HINT: "false"
      # Argon2id PHC hash of the admin-panel token (the plain token is VAULT_ADMIN_TOKEN in .env). Empty
      # disables the admin panel, so an install missing the hash fails closed.
      ADMIN_TOKEN: ${VAULT_ADMIN_TOKEN_HASH:-}
      # Origin used in Send links and invitation emails. Leave VAULT_PUBLIC_URL empty and links use the
      # loopback origin; set it to the https address users can reach if links must work from elsewhere.
      DOMAIN: ${VAULT_PUBLIC_URL:-https://127.0.0.1:8222}
      # TLS on loopback: the Bitwarden CLI refuses any non-https server. Self-signed cert made by the
      # installer in config/vault-tls; HyperProx trusts it through VAULT_CA_CERT.
      ROCKET_TLS: '{certs="/ssl/cert.pem",key="/ssl/key.pem"}'
    volumes:
      - vault_data:/data
      - ./config/vault-tls:/ssl:ro
    ports:
      - "127.0.0.1:8222:80"
    healthcheck:
      test: ["CMD", "/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  prometheus:
    image: prom/prometheus:latest
    container_name: hyperprox-prometheus
    restart: unless-stopped
    profiles: [monitoring]
    network_mode: host
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-90d}"
      - "--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-40GB}"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/rules:/etc/prometheus/rules:ro
      - ./config/prometheus/targets:/etc/prometheus/targets:ro
      # Bearer token for the plug-in metrics scrape — generated per install,
      # gitignored, mounted as a directory so a missing file cannot become one.
      - ./config/prometheus/secrets:/etc/prometheus/secrets:ro
      - ./data/prometheus:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: hyperprox-grafana
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    profiles: [monitoring]
    environment:
      - GF_SERVER_HTTP_PORT=3003
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_ALLOW_ORG_CREATE=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_COOKIE_SAMESITE=disabled
      # The Monitoring page embeds Grafana, and an http iframe on the https app is blocked as mixed content.
      # So the installer serves it through nginx at https://<host>/grafana/ by setting these in .env. Unset,
      # Grafana answers at the root of :3003 exactly as before (these defaults are Grafana's own).
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-%(protocol)s://%(domain)s:%(http_port)s/}
      - GF_SERVER_SERVE_FROM_SUB_PATH=${GRAFANA_SERVE_FROM_SUB_PATH:-false}
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3003:3003"
    networks:
      - hyperprox-net

  pve-exporter:
    image: prompve/prometheus-pve-exporter:latest
    container_name: hyperprox-pve-exporter
    restart: unless-stopped
    profiles: [monitoring]
    volumes:
      - ./config/pve-exporter/pve.yml:/etc/prometheus/pve.yml:ro
    ports:
      - "127.0.0.1:9221:9221"
    networks:
      - hyperprox-net

  # The front door: https on 443 (http on 80 redirects). Host networking, so the API, frontend and setup
  # wizard - systemd services on the host - are reached on loopback and can stay bound to 127.0.0.1
  # instead of every interface. It listens on 80 and 443 directly; there is no port mapping.
  nginx:
    image: nginx:alpine
    container_name: hyperprox-nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Mounting the whole directory is deliberate: it replaces the image's
      # stock default.conf, which nginx.conf's `include conf.d/*.conf` would
      # otherwise load instead of ours — serving /usr/share/nginx/html and
      # 404ing every route.
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      # cert.pem + key.pem: self-signed by the installer unless you supply your own (gitignored, *.pem).
      - ./certs:/etc/nginx/certs:ro

  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: hyperprox-npm
    restart: unless-stopped
    profiles: [npm]
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - hyperprox-net

networks:
  hyperprox-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  vault_data:
  grafana_data:
  npm_data:
  npm_letsencrypt:
