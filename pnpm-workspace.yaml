packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: false
  unrs-resolver: false
# Security overrides for transitive dependencies (OSV audit 2026-11): pinned fixed versions of libraries
# pulled in by other packages.
overrides:
  node-forge: 1.4.3
  ws: 8.21.0
  multer: 2.5.0
  uuid: 11.1.1
  follow-redirects: 1.16.2
  form-data: 4.0.6
  'fast-uri@2': 2.4.8
  'fast-uri@3': 3.1.9
