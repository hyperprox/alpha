packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: false
  unrs-resolver: false
# Security fixes for transitive dependencies (pre-beta review): proxy-addr GHSA-jqcg-44mw-7w3h (IPv4-mapped
# IPv6 trust), and @fastify/jwt 8's fast-jwt 4 (several JWT validation advisories, fixed in 6.3.x; @fastify/jwt 9+
# needs Fastify 5).
overrides:
  proxy-addr: ^2.0.8
  '@fastify/jwt>fast-jwt': 6.3.6
  node-forge: 1.4.3
  ws: 8.21.0
  multer: 2.5.0
  uuid: 11.1.1
  follow-redirects: 1.16.2
  form-data: 4.0.6
  'fast-uri@2': 2.4.8
  'fast-uri@3': 3.1.9
