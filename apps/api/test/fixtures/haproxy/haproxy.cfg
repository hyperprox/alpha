# _version=3
# Dataplaneapi managed File
# changing file directly can cause a conflict if dataplaneapi is running
# Managed with HyperProx. Changes made in HyperProx go through the Data Plane API and are checked with haproxy -c
# before HAProxy reloads. Hand edits are kept; run haproxy -c -f /etc/haproxy/haproxy.cfg before a reload.

global
  daemon
  chroot /var/lib/haproxy
  user haproxy
  group haproxy
  # The Runtime API: a local socket only, never a TCP port.
  stats socket /run/haproxy/admin.sock mode 660 level admin
  stats timeout 30s
  ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
  ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
  ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
  ssl-default-server-options ssl-min-ver TLSv1.2
  log /dev/log local0
  log /dev/log local1 notice

defaults unnamed_defaults_1
  mode http
  log global
  option httplog
  option redispatch
  option dontlognull
  option http-server-close
  option forwardfor
  timeout http-request 10s
  timeout check 5s
  timeout connect 5s
  timeout client 30s
  timeout queue 30s
  timeout server 30s
  timeout http-keep-alive 5s
  retries 2
  default-server inter 5s fall 3 rise 2
  errorfile 400 /etc/haproxy/errors/400.http
  errorfile 403 /etc/haproxy/errors/403.http
  errorfile 408 /etc/haproxy/errors/408.http
  errorfile 500 /etc/haproxy/errors/500.http
  errorfile 502 /etc/haproxy/errors/502.http
  errorfile 503 /etc/haproxy/errors/503.http
  errorfile 504 /etc/haproxy/errors/504.http

# Prometheus metrics for HyperProx: only /metrics, only to the addresses in hyperprox-scrapers.lst.
frontend hpx_metrics from unnamed_defaults_1
  bind :8405
  acl hpx_scraper src -f /etc/haproxy/hyperprox-scrapers.lst
  no log
  http-request deny deny_status 403 unless hpx_scraper
  http-request use-service prometheus-exporter if { path /metrics }
  http-request deny deny_status 404

# The stats page: this container's loopback only.
frontend hpx_stats from unnamed_defaults_1
  bind 127.0.0.1:8404
  no log
  stats enable
  stats uri /stats
  stats refresh 10s
  stats show-legends

# The public side. Without a matching rule HAProxy answers 503 ("No server is available").
frontend http from unnamed_defaults_1
  bind :80
  http-request set-header X-Forwarded-Proto http
  use_backend hpx_lb_web if { req.hdr(host),field(1,:) -i lb.example.test }
  http-response del-header Server

backend hpx_lb_web
  mode http
  balance roundrobin
  option httpchk GET /
  server web1 198.51.100.11:8080 check weight 100
  server web2 198.51.100.12:8080 check weight 100
