#!/usr/sbin/nft -f
# HyperProx public demo: a firewall for the demo machine (install as /etc/nftables.conf, enable nftables).
#
#   In:  only your reverse proxy, only to the demo's port. Loopback and replies.
#   Out: nothing but loopback and replies to connections that came in. The demo needs no other machine,
#        so neither a bug nor a compromised dependency can reach your network or the internet from here.
#
# Replace REVERSE_PROXY_IP and DEMO_PORT. For maintenance (apt, pnpm), open the output chain for a while
# (docs/demo.md, "Maintenance"), then reload this file: `nft -f /etc/nftables.conf`.
flush ruleset
table inet demo {
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ip saddr REVERSE_PROXY_IP tcp dport DEMO_PORT accept
    icmp type echo-request limit rate 5/second accept
  }
  chain output {
    type filter hook output priority 0; policy drop;
    oif lo accept
    ct state established,related accept
  }
}
