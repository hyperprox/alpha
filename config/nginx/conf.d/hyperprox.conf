# HyperProx front door: https on 443, and http on 80 redirecting to it.
#
# The API, frontend and setup wizard run as systemd services on the host, and this nginx shares the
# host's network (network_mode: host in docker-compose.yml), so every upstream is on loopback. That is
# what lets the installer bind the frontend and the wizard to 127.0.0.1: from the old bridge network
# they could only be reached on an address the whole LAN could reach too.
#
# The certificate is certs/cert.pem + certs/key.pem in the install directory. The installer generates a
# self-signed one when none is supplied; put your own there (full chain in cert.pem) and restart
# hyperprox-nginx to use it.

upstream frontend   { server 127.0.0.1:3000; keepalive 32; }
upstream api        { server 127.0.0.1:3002; keepalive 32; }
upstream setup      { server 127.0.0.1:3001; keepalive 16; }
upstream grafana    { server 127.0.0.1:3003; keepalive 16; }
upstream prometheus { server 127.0.0.1:9090; keepalive 8;  }

# WebSocket upgrades pass through; everything else gets an empty Connection header, so upstream keepalive
# actually keeps connections open.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# A proxy in front that has already terminated TLS (it sends X-Forwarded-Proto: https) reaches us on port
# 80. Redirecting those requests would bounce the browser round the same loop forever, so they are served,
# and the app is told the scheme the browser actually used.
map $http_x_forwarded_proto $hpx_proto {
    default $scheme;
    https   https;
}
map "$http_x_forwarded_proto:$uri" $hpx_redirect {
    default            1;
    "~^https:"         0;
    "~:/nginx-health$" 0;
}

server {
    listen 80 default_server;
    server_name _;

    if ($hpx_redirect) {
        return 301 https://$host$request_uri;
    }

    include /etc/nginx/conf.d/hyperprox-routes.inc;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:hpx_ssl:10m;
    ssl_session_timeout 1h;

    include /etc/nginx/conf.d/hyperprox-routes.inc;
}
