# The API, frontend and setup wizard run as systemd services on the host, not as
# containers on this network — `frontend:3000` and `api:3002` never resolved, so
# every proxied route failed. host.docker.internal is mapped to the host gateway
# in docker-compose.yml. Prometheus is network_mode: host, so it is reached the
# same way. Grafana is a real container on hyperprox-net and keeps its name.
upstream frontend   { server host.docker.internal:3000; keepalive 32; }
upstream api        { server host.docker.internal:3002; keepalive 32; }
upstream setup      { server host.docker.internal:3001; keepalive 16; }
upstream grafana    { server grafana:3003;              keepalive 16; }
upstream prometheus { server host.docker.internal:9090; keepalive 8;  }

server {
    listen 80;
    server_name _;

    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /setup {
        proxy_pass         http://setup;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass         http://api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /ws {
        proxy_pass          http://api;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }

    location /grafana/ {
        proxy_pass         http://grafana/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /prometheus/ {
        proxy_pass         http://prometheus/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        allow              192.168.0.0/16;
        deny               all;
    }

    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
