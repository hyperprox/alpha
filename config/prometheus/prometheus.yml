global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: hyperprox

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:

  # HyperProx plug-ins — MikroTik throughput, Plex activity. Prometheus runs
  # network_mode: host, so the API is reachable on the loopback of the container
  # host rather than through the compose network.
  - job_name: hyperprox-plugins
    scrape_interval: 30s
    scrape_timeout: 20s
    metrics_path: /api/plugins/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token

    static_configs:
      - targets: ['127.0.0.1:3002']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: node
    scrape_interval: 15s
    scrape_timeout: 10s
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/nodes.json
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [node]
        target_label: node

  - job_name: pve
    metrics_path: /pve
    params:
      module: [default]
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/pve.json
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9221

  - job_name: ceph
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/ceph.json
        refresh_interval: 30s

  - job_name: nvidia
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/nvidia.json
        refresh_interval: 30s


  - job_name: intel-gpu
    scrape_interval: 15s
    file_sd_configs:
      - files:
          - /etc/prometheus/targets/intel-gpu.json
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [node]
        target_label: node
